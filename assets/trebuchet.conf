# trebuchet configuration
# Copy this file to ~/.config/trebuchet/trebuchet.conf to customise.
# Values may optionally be quoted: key = "value" or key = value


# ── Grid layout ───────────────────────────────────────────────────────────────

# Number of app columns in the grid.
columns = 7

# Number of app rows per page.
rows = 5

# Icon size in pixels (applies to both SVG and raster icons).
icon_size = 96


# ── Custom commands ────────────────────────────────────────────────────────────
# Define commands accessible via the /cmd component.
# Type /cmd (+ space or Enter) to open the command runner, then type the prefix
# and press Enter to trigger the command. ESC returns to the app launcher.
#
# prefix         — the word to type in the /cmd search bar (no leading slash)
# command        — shell command to run (executed via sh -c)
# display_result — if true, capture stdout and display it in the result panel
#                  if false (default), run silently and close the launcher
#
# Example: power controls
#
# [[command]]
# prefix  = shutdown
# command = shutdown -h now
#
# [[command]]
# prefix  = reboot
# command = reboot
#
# Example: show command output in the result panel
#
# [[command]]
# prefix         = uptime
# command        = uptime -p
# display_result = true
#
# [[command]]
# prefix         = ip
# command        = ip -br addr show
# display_result = true
