[package]
name = "trebuchet"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "tokio", "markdown"] }
iced_layershell = "0.15"
freedesktop-desktop-entry = "0.8"
xdg = "3.0"
fuzzy-matcher = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
rust-embed = "8"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
